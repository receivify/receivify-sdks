# Values come from environment variables (see .env.example). Never hard-code the key here.
receivify.api-key=${RECEIVIFY_API_KEY:}
receivify.webhook-secret=${RECEIVIFY_WEBHOOK_SECRET:}
receivify.api-url=${RECEIVIFY_API_URL:https://receivify.io}
server.port=${PORT:8080}
# Localhost only by default; set HOST=0.0.0.0 when running in a container.
server.address=${HOST:127.0.0.1}
