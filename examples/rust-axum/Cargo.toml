[package]
name = "receivify-shop"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
# The SDK straight from this repository. Once it is on crates.io, replace with:
#   receivify = "1"
receivify = { path = "../../rust" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
